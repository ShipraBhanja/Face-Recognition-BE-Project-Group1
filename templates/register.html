{% extends 'base.html' %}{% block title %}Create workspace{% endblock %}{% block content %}
<div class="auth-wrap"><div class="eyebrow"><span class="dot"></span> GET STARTED</div><h1>Make space for<br><em>the work.</em></h1><p class="muted">Create a private local workspace for your team.</p><form class="form-card" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Username<input name="username" autocomplete="username" minlength="3" required></label><label>Password <small>12 characters minimum</small><input type="password" name="password" autocomplete="new-password" minlength="12" required></label><button class="button primary full">Create workspace <span>→</span></button></form><p class="form-foot">Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a></p></div>{% endblock %}
